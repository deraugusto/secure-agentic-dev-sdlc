# S2 · re-sanitize — the agent's own output through the same scanner that
# guards incoming content.
#
# The asymmetry is the bug this stage removes: content arriving by pull is
# treated as untrusted, content emitted by the agent is not, even though the
# agent has read the untrusted content in between.
stage_id: s2-resanitize
version: "1.0"
deny_default: true
waivable: false
capabilities:
  fs_read:
    - scope: "<CHANGESET_ROOT>/**"
    - scope: "<WORKING_COPY>/layers/l1-input-hardening/patterns/**"
  fs_write:
    - scope: "<AUDIT_DIR>/s2/**"
  net_egress: []
  exec:
    - command: python3
      args: ["layers/l1-input-hardening/sanitize.py"]
      target: "<CHANGESET_ROOT>"
scope_checks:
  path_must_be_within: ["<CHANGESET_ROOT>", "<AUDIT_DIR>", "<WORKING_COPY>/layers/l1-input-hardening"]
  reject_symlink_escape: true
  reject_writes_to: ["<WORKING_COPY>/**"]
hash_verify:
  manifest_self_hash: "28c02839b40370ae46ad825df5384624417c4805fd69db1e20fbe81e7a6dd45c"
  input_bundle_hash_required: true
audit:
  per_operation: true
  sink: "<AUDIT_DIR>/s2/audit.jsonl"
