# L4 pre-receive configuration.
#
# Parsed, never sourced. Unknown keys are reported and ignored. Whitespace
# around '=' is trimmed; surrounding double quotes are stripped; '#' starts a
# comment. Lists are space separated.
#
# Copy this next to the installed hook on the git server. Environment variables
# of the same name with an SDLC_ prefix override these at run time.

# Net deletions (deletions minus insertions) above this count as destructive.
# Net, not gross: a restructure moves lines and nets near zero, a mass delete
# does not. Tune it to your repository's rhythm -- too low and the bypass tag
# becomes routine, which is the failure mode this whole layer is exposed to.
DELETION_THRESHOLD=500

# Append-only audit trail. One line per ref update, including passes: a guard
# that only logs refusals cannot answer "was this push evaluated at all".
AUDIT_LOG=/var/log/sdlc-pre-receive-audit.jsonl

# Path globs whose deletion is destructive regardless of line count. Decision
# records are append-only by convention; this makes it structural.
PROTECTED_GLOBS=docs/adr/*.md

# Individual files whose deletion is destructive. Governance documents belong
# here: losing them silently is how a repository's rules stop applying.
PROTECTED_FILES=CONVENTIONS.md FOCUS-TEMPLATE.md docs/adr/ADR-INDEX.md inventory.example.yaml

# Refs that may not be deleted. On a forge with branch protection this overlaps
# with the UI setting; keep both. The forge setting is convenient and the hook
# setting is the one that survives an administrator mistake.
PROTECTED_REFS=refs/heads/main refs/heads/master

# The bypass vocabulary. Free text is deliberately impossible: an operator who
# must choose a category writes an audit trail that is still legible a year
# later, and "[ALLOW-DESTRUCTIVE: ok]" never becomes the house style.
# Extending this list is a decision worth recording in an ADR.
BYPASS_VOCABULARY=repo-restructure legacy-cleanup branch-rebase archive-migration
